<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-labelledby="t d">
  <title id="t">How a bug moves from discovery to upstream</title>
  <desc id="d">Find, reproduce, file an issue, create a fix branch, open a reviewed pull request, then open the upstream pull request. Security findings also get a GitHub security advisory before the fix branch.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F76707"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E03131"/></marker>
  </defs>
  <line x1="200" y1="88.0" x2="228" y2="88.0" stroke="#F76707" stroke-width="3" marker-end="url(#ah)"/><line x1="412" y1="88.0" x2="440" y2="88.0" stroke="#F76707" stroke-width="3" marker-end="url(#ah)"/><line x1="624" y1="88.0" x2="652" y2="88.0" stroke="#F76707" stroke-width="3" marker-end="url(#ah)"/><line x1="836" y1="88.0" x2="864" y2="88.0" stroke="#F76707" stroke-width="3" marker-end="url(#ah)"/><line x1="1048" y1="88.0" x2="1076" y2="88.0" stroke="#F76707" stroke-width="3" marker-end="url(#ah)"/>
