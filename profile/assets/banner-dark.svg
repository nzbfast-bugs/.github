<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-labelledby="t d">
  <title id="t">nzbfast-bugs</title>
  <desc id="d">Finding, reproducing, and fixing bugs in nzbfast, the Rust Usenet downloader, before they reach upstream. Early alpha, not production ready.</desc>
  <style>
    .stripes { animation: slide 3s linear infinite; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(56.5685px); } }
    .beacon { animation: pulse 1.6s ease-in-out infinite; transform-origin: 340px 113px; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .25; transform: scale(.6); } }
    .stamp { animation: thump 6s ease-in-out infinite; transform-origin: 1105px 196px; }
    @keyframes thump { 0%,88%,100% { transform: rotate(-9deg) scale(1); } 92% { transform: rotate(-9deg) scale(1.06); } }
    
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  </style>
  <defs>
    
    <linearGradient id="bnut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F76707"/><stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="bshell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD43B"/><stop offset="1" stop-color="#FFB020"/>
    </linearGradient>
    <radialGradient id="bhole" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#2C211C"/><stop offset="1" stop-color="#0F0D0C"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C130F"/><stop offset="1" stop-color="#0F0D0C"/></linearGradient>
    <radialGradient id="glow" cx="0.14" cy="0.5" r="0.42"><stop offset="0" stop-color="#D9480F" stop-opacity="0.42"/><stop offset="1" stop-color="#D9480F" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFF4E6" stroke-opacity="0.05"/></pattern>
    <pattern id="hz" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="40" fill="#FFB020"/><rect x="20" width="20" height="40" fill="#1A1614"/>
    </pattern>
    <clipPath id="top"><rect width="1280" height="16"/></clipPath>
    <clipPath id="bot"><rect y="364" width="1280" height="16"/></clipPath>
  </defs>
  <rect width="1280" height="380" fill="url(#bg)"/>
  <rect width="1280" height="380" fill="url(#grid)"/>
  <rect width="1280" height="380" fill="url(#glow)"/>
  <g clip-path="url(#top)"><rect class="stripes" x="-120" width="1440" height="16" fill="url(#hz)"/></g>
  <g clip-path="url(#bot)"><rect class="stripes" x="-120" y="364" width="1440" height="16" fill="url(#hz)"/></g>

  <g transform="translate(64 78) scale(0.875)">
    <polygon points="128,10 230,69 230,187 128,246 26,187 26,69" fill="url(#bnut)" stroke="url(#bnut)" stroke-width="10" stroke-linejoin="round"/>
    <polygon points="128,34 209,81 209,175 128,222 47,175 47,81" fill="url(#bhole)" stroke="#FFB020" stroke-opacity="0.55" stroke-width="3" stroke-linejoin="round"/>
    <g fill="none" stroke="#FFB020" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M92 120 L68 104 L62 86"/><path d="M86 148 L60 148 L50 134"/><path d="M92 176 L70 192 L64 210"/><path d="M164 120 L188 104 L194 86"/><path d="M170 148 L196 148 L206 134"/><path d="M164 176 L186 192 L192 210"/></g>
    <g fill="none" stroke="#FFB020" stroke-width="5" stroke-linecap="round">
      <path d="M120 70 Q110 52 100 44"/><path d="M136 70 Q146 52 156 44"/>
    </g>
    <circle cx="99" cy="43" r="5" fill="#FFD43B"/><circle cx="157" cy="43" r="5" fill="#FFD43B"/>
    <circle cx="128" cy="84" r="19" fill="#F59F00"/>
    <ellipse cx="128" cy="150" rx="44" ry="58" fill="url(#bshell)"/>
    <polygon points="140,100 110,152 129,152 116,200 150,138 131,138 146,100" fill="#1A1614" stroke="#1A1614" stroke-width="2" stroke-linejoin="round"/></g>

  <circle class="beacon" cx="340" cy="113" r="6" fill="#E03131"/>
  <text x="356" y="119" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="3" fill="#FFB020">COMMUNITY QA FOR NZBFAST</text>
  <text x="326" y="200" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="-2" fill="#FFF4E6">nzbfast<tspan fill="#F76707">-bugs</tspan></text>
  <text font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#FFF4E6" fill-opacity="0.88">
    <tspan x="330" y="244">Finding, reproducing, and fixing bugs in nzbfast,</tspan>
    <tspan x="330" y="276">the Rust Usenet downloader, before they reach upstream.</tspan>
  </text>
  <g transform="translate(330 306)"><rect width="68" height="34" rx="17" fill="#231C19" stroke="#4A3A33" stroke-width="1.5"/><text x="34.0" y="22.5" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="16" fill="#FFF4E6">Rust</text></g><g transform="translate(410 306)"><rect width="88" height="34" rx="17" fill="#231C19" stroke="#4A3A33" stroke-width="1.5"/><text x="44.0" y="22.5" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="16" fill="#FFF4E6">Usenet</text></g><g transform="translate(510 306)"><rect width="232" height="34" rx="17" fill="#231C19" stroke="#4A3A33" stroke-width="1.5"/><text x="116.0" y="22.5" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="16" fill="#FFF4E6">SABnzbd + NZBGet APIs</text></g><g transform="translate(754 306)"><rect width="193" height="34" rx="17" fill="#231C19" stroke="#4A3A33" stroke-width="1.5"/><text x="96.5" y="22.5" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="16" fill="#FFF4E6">fixes go upstream</text></g>

  <g class="stamp" transform="rotate(-9 1105 196)">
    <rect x="990" y="116" width="230" height="160" rx="14" fill="#E03131" fill-opacity="0.08" stroke="#E03131" stroke-width="5"/>
    <rect x="1001" y="127" width="208" height="138" rx="8" fill="none" stroke="#E03131" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="1105" y="180" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="4" fill="#E03131">EARLY</text>
    <text x="1105" y="226" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="4" fill="#E03131">ALPHA</text>
    <text x="1105" y="252" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2.5" fill="#E03131">NOT PRODUCTION READY</text>
  </g>
</svg>
